<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Доминанта — концепты главной страницы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#101314;--grey:#6A7073;--line:#E2E5E7;--bg:#F4F5F6;--orange:#FF540F;--ease-out:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 'Onest',Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 32px}
header{padding:56px 0 44px;display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap}
header p.cap{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;color:var(--grey);margin-bottom:16px}
h1{font-size:clamp(34px,4.6vw,64px);font-weight:600;letter-spacing:-.035em;line-height:1.02}
header p.note{max-width:420px;color:var(--grey)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:72px}
.card{background:#fff;border-radius:20px;padding:12px 12px 22px;display:block;opacity:0;translate:0 18px;animation:enter .6s var(--ease-out) forwards;transition:box-shadow .2s ease}
.card:nth-child(2){animation-delay:60ms}.card:nth-child(3){animation-delay:120ms}.card:nth-child(4){animation-delay:180ms}.card:nth-child(5){animation-delay:240ms}.card:nth-child(6){animation-delay:300ms}.card:nth-child(7){animation-delay:360ms}
@keyframes enter{to{opacity:1;translate:0 0}}
.shot{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--bg);container-type:inline-size}
.shot iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.meta{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 10px 0}
.meta span{font-size:13px;color:var(--grey);font-weight:500}
.meta h2{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.meta i{font-style:normal;flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:18px;transition:background .2s ease,color .2s ease}
.card p{padding:10px 10px 0;font-size:14.5px;color:var(--grey)}
@media(hover:hover) and (pointer:fine){
 .card:hover{box-shadow:0 18px 40px -22px rgba(16,19,20,.35)}
 .card:hover .meta i{background:var(--orange);color:#fff}
}
footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:13.5px;color:var(--grey)}
@media(max-width:1000px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr;gap:14px}header{padding:36px 0 28px}}
@media(min-width:1001px) and (max-width:1300px){.grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.card{translate:none;animation-name:fade;animation-duration:.3s}@keyframes fade{to{opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><p class="cap">Стоматология «Доминанта» · редизайн сайта</p><h1>Семь концептов<br>главной страницы</h1></div>
    <p class="note">Во&nbsp;всех вариантах один набор блоков и&nbsp;текстов&nbsp;— отличаются дизайн и&nbsp;вёрстка. Откройте любой, внутри можно переключаться между концептами.</p>
  </header>
  <main class="grid" id="concept-grid"></main>
  <footer>Рабочие макеты для обсуждения. Фото и&nbsp;тексты взяты с&nbsp;действующего сайта клиники.</footer>
</div>
<script>
const CONCEPTS = [
  ['Сетка', 'Строгая чёрно-белая сетка, боковое меню с номерами разделов, крупные заголовки.'],
  ['Бенто', 'Светло-серый фон, плитка из белых и графитовых карточек, быстрая запись на первом экране.'],
  ['Семейная', 'Белый с мятным, крупные скругления, дружелюбная подача, запись под первым экраном.'],
  ['Фото', 'Полноэкранные снимки клиники, лёгкая типографика, форма записи поверх фото.'],
  ['Яркий', 'Фирменный оранжевый как главный цвет, плакатные заголовки, бегущая строка.'],
  ['Сервис', 'Как приложение: запись закреплена сбоку, фильтр врачей, выбор проблемы в один клик.'],
  ['Бенто во всю ширину', 'Плитка из концепта 2, растянутая на весь экран, с крупным масштабом блоков из концепта 1.']
];
document.getElementById('concept-grid').innerHTML = CONCEPTS.map(([name, text], i) => `
  <a class="card" href="concept-${i + 1}.html">
    <div class="shot"><iframe src="concept-${i + 1}.html" loading="lazy" tabindex="-1" aria-hidden="true" title="Превью концепта ${i + 1}"></iframe></div>
    <div class="meta"><div><span>Концепт ${i + 1}</span><h2>${name}</h2></div><i>→</i></div>
    <p>${text}</p>
  </a>`).join('');

const fitPreviews = () => document.querySelectorAll('.shot').forEach(shot => {
  shot.firstElementChild.style.transform = `scale(${shot.clientWidth / 1440})`;
});
fitPreviews();
window.addEventListener('resize', fitPreviews);
</script>
</body>
</html>
